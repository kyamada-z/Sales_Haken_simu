name: Security phase 2 verification

on:
  push:
    branches: [codex/security-maintenance-phase2]
  pull_request:
    branches: [main]
    paths:
      - package.json
      - package-lock.json
      - scripts/security-policy*
      - .github/workflows/security-verify.yml
      - vite.config.js
      - .github/workflows/deploy.yml
      - scripts/security-pilot.py
      - scripts/security-pilot.test.py
      - .github/workflows/pages-pilot-once.yml
      - scripts/security-pilot-once.py
      - scripts/security-pilot-once.test.py
      - scripts/security-pilot-browser.mjs

permissions:
  contents: read

concurrency:
  group: security-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    if: github.event_name != 'pull_request' || !startsWith(github.head_ref, 'codex/security-auto-')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout isolated branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
      - name: Verify dependency update policy
        run: node --test scripts/security-policy.test.mjs
      - name: Check reviewed pilot baseline and same-major policy
        shell: bash
        run: |
          set -euo pipefail
          initial=a13b9c390e8ae29dda66019d2c335f5260fca217
          # The only approved major update is the immutable two-file pilot commit.
          pilot=8e3b0360a583442445577e14689fe8dd04452905
          git merge-base --is-ancestor "$pilot" HEAD
          git diff --exit-code "$initial" HEAD -- . \
            ':!package.json' ':!package-lock.json' ':!vite.config.js' \
            ':!.github/workflows/security-verify.yml' ':!.github/workflows/deploy.yml' \
            ':!scripts/security-pilot.py' ':!scripts/security-pilot.test.py' \
            ':!.github/workflows/pages-pilot-once.yml' \
            ':!scripts/security-pilot-once.py' ':!scripts/security-pilot-once.test.py' \
            ':!scripts/security-pilot-browser.mjs'
          printf '%s\n' \
            '9bad5ead817b94a015bc5280a5853098321443b1460a18c2faaac6c37b01169f  vite.config.js' \
            'ef92d532c5364a30971d98a0539dc04651e712232575209573cc73f06fe2653c  .github/workflows/deploy.yml' \
            '0399e69ed5525c0d3c5966cb9ba2db8e326d6d6d7f4f05c35091f9e6d5f6a5b8  scripts/security-pilot.py' \
            '9cef1ce02b7cdc1c36101452549ca3ce15f3eba9c132966981ecbd237d978868  scripts/security-pilot.test.py' \
            '6213b06170081dc055545239c73c104b50cf62abaefabd577a6305d4878f93a3  .github/workflows/pages-pilot-once.yml' \
            'a557f7807ef92b04a2b5f8bd97950c870d0f52c70b4b3981dac0346bb0497a93  scripts/security-pilot-once.py' \
            '9e5f8b7b0bdc5417d91912ee8165bce79d7ab89eec9a97bb763abe3fa503af17  scripts/security-pilot-once.test.py' \
            '82127328a2d259a794dbe3ef9f2960af43e0e4f08ad5edd9e2173a2976f288c6  scripts/security-pilot-browser.mjs' \
            | sha256sum --check --status
          # Load the original validators, never a policy altered by the PR.
          git show "$initial:scripts/security-policy.mjs" > "$RUNNER_TEMP/trusted-security-policy.mjs"
          TRUSTED_POLICY="$RUNNER_TEMP/trusted-security-policy.mjs" PILOT_BASE="$pilot" node --input-type=module <<'JS'
          import { execFileSync } from 'node:child_process';
          import { readFileSync } from 'node:fs';
          import { pathToFileURL } from 'node:url';
          const { validateManifestChange, validateLockfile } = await import(pathToFileURL(process.env.TRUSTED_POLICY).href);
          const before = path => JSON.parse(execFileSync('git', ['show', `${process.env.PILOT_BASE}:${path}`], {encoding:'utf8'}));
          const after = path => JSON.parse(readFileSync(path, 'utf8'));
          validateManifestChange(before('package.json'), after('package.json'));
          validateLockfile(before('package.json'), after('package.json'), before('package-lock.json'), after('package-lock.json'));
          console.log('Reviewed Vite pilot baseline and ordinary same-major policy verified; this check cannot publish.');
          JS
      - name: Verify pilot recovery boundaries offline
        run: |
          python3 scripts/security-pilot.test.py
          python3 scripts/security-pilot-once.test.py
          node scripts/security-pilot-browser.mjs --self-test
      - name: Reproduce dependencies without install scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build application
        run: npm run build
      - name: Audit resolved npm dependencies
        run: npm audit --json > security-audit.json
      - name: Install temporary integrity-pinned official Chromium tooling
        run: |
          python3 scripts/security-pilot-once.py tooling --out "$RUNNER_TEMP/sales-browser"
          npm ci --prefix "$RUNNER_TEMP/sales-browser" --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org
          node "$RUNNER_TEMP/sales-browser/node_modules/playwright-core/cli.js" install --with-deps chromium
      - name: Verify real browser calculations, three charts and synthetic storage on loopback
        env:
          PLAYWRIGHT_CORE: ${{ runner.temp }}/sales-browser/node_modules/playwright-core/index.mjs
        run: node scripts/security-pilot-browser.mjs --site dist --phase branch-ci --out browser-evidence
      - name: Retain synthetic browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: security-browser-${{ github.sha }}-${{ github.run_attempt }}
          path: browser-evidence
          retention-days: 14
          if-no-files-found: ignore
      - name: Retain audit report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: security-audit-${{ github.sha }}-${{ github.run_attempt }}
          path: security-audit.json
          retention-days: 14
          if-no-files-found: ignore

# This workflow cannot deploy: read-only contents; no Pages permission or deployment step.


